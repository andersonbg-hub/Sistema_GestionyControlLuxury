name: Publicar Luxury actualizado en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias del proyecto
        working-directory: luxury-flutter-fuente
        run: flutter pub get

      - name: Compilar version actual de Flutter Web
        working-directory: luxury-flutter-fuente
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          if [ "${REPOSITORY_NAME}" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            BASE_HREF="/"
          else
            BASE_HREF="/${REPOSITORY_NAME}/"
          fi
          flutter build web --release --base-href "$BASE_HREF"
          test -s build/web/index.html
          test -s build/web/main.dart.js
          test -s build/web/assets/assets/images/portada_restaurante.png

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar sitio desde compilacion reciente
        run: |
          mkdir -p _site
          cp -a luxury-flutter-fuente/build/web/. _site/
          touch _site/.nojekyll

      - name: Subir sitio compilado
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
