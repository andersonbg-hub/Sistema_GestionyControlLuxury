name: Publicar Luxury en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar aplicacion Flutter compilada
        run: |
          unzip -q luxury-web.zip -d _site
          test -s _site/index.html
          test -s _site/main.dart.js
          test -f _site/assets/FontManifest.json

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
