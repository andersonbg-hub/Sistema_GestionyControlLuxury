name: Publicar Luxury en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias
        working-directory: luxury-flutter-fuente
        run: flutter pub get

      - name: Compilar web con los cambios recientes
        working-directory: luxury-flutter-fuente
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          flutter build web --release --base-href "/${REPOSITORY_NAME}/"
          test -s build/web/index.html
          test -s build/web/main.dart.js

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar sitio actualizado
        run: |
          mkdir -p _site
          cp -a luxury-flutter-fuente/build/web/. _site/
          touch _site/.nojekyll

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
