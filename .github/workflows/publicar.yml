name: Publicar Luxury actualizado en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: luxury-flutter-fuente
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.5'
          cache: true
      - name: Preparar dependencias
        run: flutter pub get
      - name: Ejecutar pruebas (informativas)
        continue-on-error: true
        run: flutter test
      - name: Compilar web con ruta del repositorio
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          BASE_HREF="/$REPO_NAME/"
          if [[ "$REPO_NAME" == *.github.io ]]; then BASE_HREF="/"; fi
          if [ -f config/supabase.public.json ]; then
            flutter build web --release --base-href "$BASE_HREF" --dart-define-from-file=config/supabase.public.json
          else
            flutter build web --release --base-href "$BASE_HREF"
          fi
          test -s build/web/index.html
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir aplicación
        uses: actions/upload-pages-artifact@v3
        with:
          path: luxury-flutter-fuente/build/web
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
